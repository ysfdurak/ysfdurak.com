<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">WBGT hesabı ve referans değerle karşılaştırma</title>
  <desc id="d">WBGT iç ortamda yaş termometre yüzde 70, glob termometre yüzde 30 ağırlıkla hesaplanır. Önce WBGT 29,6, ağır iş referansı 26,6: 3 derece aşım. Önlemlerden sonra WBGT 27,8, orta iş referansı 28,2: referansın 0,4 derece altında.</desc>
  <rect width="680" height="410" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#13294b">İç ortam: WBGT = 0,7 × yaş + 0,3 × glob</text>
  <rect x="63" y="84" width="14" height="70" rx="7" fill="#ffffff" stroke="#4a5872" stroke-width="2"/>
  <circle cx="70" cy="164" r="13" fill="#1d4ed8" stroke="#4a5872" stroke-width="2"/>
  <rect x="67" y="108" width="6" height="52" fill="#1d4ed8"/>
  <text x="70" y="200" font-size="13" font-weight="600" fill="#14213a" text-anchor="middle">Yaş (nem)</text>
  <text x="70" y="72" font-size="18" font-weight="800" fill="#13294b" text-anchor="middle">0,7</text>
  <rect x="153" y="84" width="14" height="70" rx="7" fill="#ffffff" stroke="#4a5872" stroke-width="2"/>
  <circle cx="160" cy="164" r="13" fill="#1f2937" stroke="#4a5872" stroke-width="2"/>
  <rect x="157" y="108" width="6" height="52" fill="#1f2937"/>
  <text x="160" y="200" font-size="13" font-weight="600" fill="#14213a" text-anchor="middle">Glob (ışınım)</text>
  <text x="160" y="72" font-size="18" font-weight="800" fill="#13294b" text-anchor="middle">0,3</text>
  <text x="24" y="242" font-size="13" fill="#4a5872">Nemli ortamda ter buharlaşmaz;</text>
  <text x="24" y="260" font-size="13" fill="#4a5872">en büyük ağırlık yaş termometrede.</text>
  <line x1="300" y1="320" x2="660" y2="320" stroke="#dde3ec" stroke-width="1"/>
  <text x="292" y="325" font-size="12" fill="#4a5872" text-anchor="end">20°</text>
  <line x1="300" y1="280" x2="660" y2="280" stroke="#eef1f5" stroke-width="1"/>
  <text x="292" y="285" font-size="12" fill="#4a5872" text-anchor="end">22°</text>
  <line x1="300" y1="240" x2="660" y2="240" stroke="#eef1f5" stroke-width="1"/>
  <text x="292" y="245" font-size="12" fill="#4a5872" text-anchor="end">24°</text>
  <line x1="300" y1="200" x2="660" y2="200" stroke="#eef1f5" stroke-width="1"/>
  <text x="292" y="205" font-size="12" fill="#4a5872" text-anchor="end">26°</text>
  <line x1="300" y1="160" x2="660" y2="160" stroke="#eef1f5" stroke-width="1"/>
  <text x="292" y="165" font-size="12" fill="#4a5872" text-anchor="end">28°</text>
  <line x1="300" y1="120" x2="660" y2="120" stroke="#eef1f5" stroke-width="1"/>
  <text x="292" y="125" font-size="12" fill="#4a5872" text-anchor="end">30°</text>
  <rect x="330" y="128.0" width="60" height="192.0" rx="4" fill="#b42318"/>
  <text x="360" y="120.0" font-size="15" font-weight="800" fill="#b42318" text-anchor="middle">29,6</text>
  <line x1="320" y1="188.0" x2="460" y2="188.0" stroke="#14213a" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="400" y="206.0" font-size="12.5" font-weight="700" fill="#14213a">Referans 26,6</text>
  <text x="390" y="342" font-size="14" font-weight="700" fill="#14213a" text-anchor="middle">Önce · ağır iş</text>
  <text x="390" y="362" font-size="13" font-weight="700" fill="#b42318" text-anchor="middle">+3,0 °C aşım</text>
  <rect x="510" y="164.0" width="60" height="156.0" rx="4" fill="#0f766e"/>
  <text x="540" y="156.0" font-size="15" font-weight="800" fill="#0f766e" text-anchor="middle">27,8</text>
  <line x1="500" y1="156.0" x2="640" y2="156.0" stroke="#14213a" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="580" y="150.0" font-size="12.5" font-weight="700" fill="#14213a">Referans 28,2</text>
  <text x="570" y="342" font-size="14" font-weight="700" fill="#14213a" text-anchor="middle">Sonra · orta iş</text>
  <text x="570" y="362" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">−0,4 °C altında</text>
  <text x="300" y="58" font-size="14" font-weight="600" fill="#4a5872">Yükleme rampası, temmuz öğleden sonra (ısıya alışık)</text>
  <text x="300" y="78" font-size="13" fill="#4a5872">Önlem: ışınım perdesi + fan, transpalet ve konveyör</text>
  <text x="24" y="396" font-size="13" font-weight="600" fill="#b42318">Isıya alışık olmayan yeni çalışan için ağır işte referans 23,0 °C: aşım 6,6 °C'ye çıkar.</text>
</svg>
