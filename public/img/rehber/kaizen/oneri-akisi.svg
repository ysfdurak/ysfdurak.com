<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Öneriden kapanışa yedi aşamalı akış</title>
  <desc id="d">Öneri girişi, ön değerlendirme (3 iş günü), bölüm kararı (10 iş günü), aksiyon planı (5 iş günü), uygulama, kazanç ve onay-puan-ödül (10 iş günü). Eksik öneri revizyona döner, ret yalnızca gerekçeyle yapılır, uygulanamayan öneri kapanır.</desc>
