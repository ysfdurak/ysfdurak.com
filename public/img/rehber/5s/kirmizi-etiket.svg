    <rect x="262" y="170" width="16" height="16" rx="3" fill="#b42318"/><path d="M265 178 l4 4 l7 -9" stroke="#fff" stroke-width="2.4" fill="none"/><text x="285" y="184">Bozuk</text>
    <rect x="358" y="170" width="16" height="16" rx="3" fill="#fff" stroke="#14213a" stroke-width="1.5"/><text x="381" y="184">Fazla</text>
    <rect x="150" y="196" width="16" height="16" rx="3" fill="#fff" stroke="#14213a" stroke-width="1.5"/><text x="173" y="210">Sahibi belli değil</text>
