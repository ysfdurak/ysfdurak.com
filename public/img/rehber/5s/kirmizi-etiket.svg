    <text x="36" y="128" font-weight="700">Alan</text><text x="150" y="128">Paketleme masası 2</text>
    <text x="36" y="156" font-weight="700">Eşya</text><text x="150" y="156">Bant tabancası (2 adet)</text>
    <text x="36" y="184" font-weight="700">Neden</text>
  </g>
  <g font-size="15" fill="#14213a">
