<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Örnek kırmızı etiket</title>
  <desc id="d">Kırmızı etiket örneği. Alanlar: tarih, alan, eşya, etiketleyen, neden (gereksiz, bozuk, fazla, sahibi belli değil), karar tarihi (etiketten 30 gün sonra) ve karar (at, başka alana taşı, yerinde kalsın).</desc>
