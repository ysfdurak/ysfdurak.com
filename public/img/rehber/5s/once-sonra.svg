<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Paketleme masası: 5S öncesi ve sonrası</title>
  <desc id="d">Solda dağınık bir paketleme masası: bant tabancaları, etiket ruloları ve kutular karışık, boş paletler gelişigüzel duruyor. Sağda aynı masa 5S sonrası: aletler duvardaki gölge panoda, masa boş, boş palet alanı zeminde sarı çizgiyle işaretli, kırmızı etiket alanı ayrılmış.</desc>
  <rect width="680" height="400" fill="#ffffff"/>
  <!-- Panel başlıkları -->
  <rect x="10" y="10" width="320" height="380" rx="14" fill="#fdf3f2" stroke="#efd2cf"/>
  <rect x="350" y="10" width="320" height="380" rx="14" fill="#eef7f5" stroke="#cbe6e1"/>
  <text x="30" y="44" font-size="22" font-weight="800" fill="#b42318">Önce</text>
  <text x="370" y="44" font-size="22" font-weight="800" fill="#0f766e">Sonra</text>

  <!-- ÖNCE: duvar ve zemin -->
  <line x1="30" y1="290" x2="310" y2="290" stroke="#c9d1dc" stroke-width="2"/>
  <!-- masa -->
  <rect x="50" y="190" width="200" height="14" rx="3" fill="#8a6a4a"/>
  <rect x="62" y="204" width="10" height="86" fill="#8a6a4a"/>
  <rect x="228" y="204" width="10" height="86" fill="#8a6a4a"/>
  <!-- dağınık eşyalar masada -->
  <rect x="60" y="160" width="46" height="30" rx="2" fill="#d6b98c" stroke="#a88a5c" transform="rotate(-8 83 175)"/>
  <rect x="100" y="150" width="38" height="40" rx="2" fill="#e2c79c" stroke="#a88a5c" transform="rotate(6 119 170)"/>
  <circle cx="160" cy="178" r="12" fill="#f5f7fa" stroke="#7a8699" stroke-width="3"/>
  <circle cx="178" cy="182" r="9" fill="#f5f7fa" stroke="#7a8699" stroke-width="3"/>
  <g transform="rotate(-25 210 176)"><rect x="196" y="170" width="34" height="12" rx="3" fill="#4a5872"/><rect x="200" y="182" width="8" height="14" rx="2" fill="#4a5872"/></g>
  <g transform="rotate(40 140 200)"><rect x="128" y="196" width="26" height="6" rx="2" fill="#c2410c"/></g>
  <!-- yerde dağınık -->
  <g transform="rotate(-12 95 270)"><rect x="70" y="262" width="60" height="10" fill="#b08455"/><rect x="70" y="276" width="60" height="10" fill="#b08455"/></g>
  <rect x="255" y="232" width="12" height="58" fill="#b08455" transform="rotate(14 261 261)"/>
  <rect x="270" y="236" width="12" height="54" fill="#b08455" transform="rotate(9 276 263)"/>
  <rect x="150" y="262" width="34" height="28" rx="2" fill="#e2c79c" stroke="#a88a5c"/>
  <g transform="rotate(30 205 282)"><rect x="192" y="276" width="26" height="9" rx="3" fill="#4a5872"/></g>
  <!-- soru işaretleri -->
  <text x="276" y="140" font-size="30" font-weight="800" fill="#b42318">?</text>
  <text x="40" y="128" font-size="24" font-weight="800" fill="#b42318">?</text>
  <text x="30" y="330" font-size="15" fill="#14213a">• Bant tabancası 3 farklı yerde</text>
  <text x="30" y="352" font-size="15" fill="#14213a">• Boş paletler yürüme yolunda</text>
  <text x="30" y="374" font-size="15" fill="#14213a">• Aranan alet her seferinde aranıyor</text>

  <!-- SONRA: gölge pano -->
  <rect x="392" y="62" width="196" height="88" rx="6" fill="#ffffff" stroke="#13294b" stroke-width="2"/>
  <text x="490" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#13294b">GÖLGE PANO</text>
  <g>
    <rect x="404" y="92" width="44" height="46" rx="4" fill="#d9dee7"/>
    <g transform="translate(408 104)"><rect width="34" height="12" rx="3" fill="#4a5872"/><rect x="4" y="12" width="8" height="14" rx="2" fill="#4a5872"/></g>
    <rect x="458" y="92" width="44" height="46" rx="4" fill="#d9dee7"/>
    <circle cx="480" cy="115" r="13" fill="#f5f7fa" stroke="#7a8699" stroke-width="3"/>
    <rect x="512" y="92" width="64" height="46" rx="4" fill="#d9dee7"/>
    <rect x="524" y="112" width="40" height="7" rx="2" fill="#c2410c"/>
  </g>
  <!-- masa temiz -->
  <rect x="390" y="190" width="200" height="14" rx="3" fill="#8a6a4a"/>
  <rect x="402" y="204" width="10" height="86" fill="#8a6a4a"/>
  <rect x="568" y="204" width="10" height="86" fill="#8a6a4a"/>
  <rect x="470" y="166" width="40" height="24" rx="2" fill="#e2c79c" stroke="#a88a5c"/>
  <!-- zemin ve sarı çizgili palet alanı -->
  <line x1="370" y1="290" x2="650" y2="290" stroke="#c9d1dc" stroke-width="2"/>
  <rect x="598" y="226" width="58" height="62" fill="none" stroke="#eab308" stroke-width="4" stroke-dasharray="10 6"/>
  <rect x="606" y="268" width="42" height="8" fill="#b08455"/>
  <rect x="606" y="256" width="42" height="8" fill="#b08455"/>
  <rect x="606" y="244" width="42" height="8" fill="#b08455"/>
  <text x="627" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#854d0e">PALET</text>
  <!-- işaret çizgileri -->
  <text x="370" y="330" font-size="15" fill="#14213a">• Her aletin yeri gölge panoda</text>
  <text x="370" y="352" font-size="15" fill="#14213a">• Boş palet alanı sarı çizgili</text>
  <text x="370" y="374" font-size="15" fill="#14213a">• Eksik alet bir bakışta görünür</text>
</svg>
