<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">STAR tekniği: Durum, Görev, Eylem, Sonuç</title>
  <desc id="d">Durum ve görev kısa, eylem cevabın yarıdan fazlası, sonuç sayı ve dayanakla. Altında üç takip sorusu: dayanak, alternatif, öğrenme.</desc>
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#13294b">Bir STAR cevabında sürenin dağılımı</text>
  <rect x="24" y="56" width="90.8" height="92" rx="8" fill="#94a3b8"/>
  <text x="69.4" y="98" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
  <text x="69.4" y="128" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Durum</text>
  <text x="69.4" y="172" font-size="13" fill="#4a5872" text-anchor="middle">1–2 cümle</text>
  <rect x="118.8" y="56" width="59.2" height="92" rx="8" fill="#64748b"/>
  <text x="148.4" y="98" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">T</text>
  <text x="148.4" y="128" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Görev</text>
  <text x="118.8" y="172" font-size="13" fill="#4a5872" text-anchor="start">1 cümle</text>
  <rect x="182.0" y="56" width="343.6" height="92" rx="8" fill="#0f766e"/>
  <text x="353.8" y="98" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
  <text x="353.8" y="128" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Eylem</text>
  <text x="353.8" y="172" font-size="13" fill="#4a5872" text-anchor="middle">Siz neyi, nasıl, neden yaptınız?</text>
  <rect x="529.6" y="56" width="122.4" height="92" rx="8" fill="#1d4ed8"/>
  <text x="590.8" y="98" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">R</text>
  <text x="590.8" y="128" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Sonuç</text>
  <text x="590.8" y="172" font-size="13" fill="#4a5872" text-anchor="middle">Sayı ve dayanak</text>
  <text x="355.8" y="200" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">Ağırlık eylemde: “biz” değil “ben”</text>
  <text x="24" y="240" font-size="16" font-weight="700" fill="#13294b">Takip sorularına hazırlık</text>
  <rect x="24" y="254" width="204" height="64" rx="10" fill="#ffffff" stroke="#dde3ec" stroke-width="2"/>
  <text x="38" y="280" font-size="15" font-weight="700" fill="#14213a">Dayanak</text>
  <text x="38" y="303" font-size="12.5" fill="#4a5872">Sonucu nereden biliyorsunuz?</text>
  <rect x="238" y="254" width="204" height="64" rx="10" fill="#ffffff" stroke="#dde3ec" stroke-width="2"/>
  <text x="252" y="280" font-size="15" font-weight="700" fill="#14213a">Alternatif</text>
  <text x="252" y="303" font-size="12.5" fill="#4a5872">Başka ne yapabilirdiniz?</text>
  <rect x="452" y="254" width="204" height="64" rx="10" fill="#ffffff" stroke="#dde3ec" stroke-width="2"/>
  <text x="466" y="280" font-size="15" font-weight="700" fill="#14213a">Öğrenme</text>
  <text x="466" y="303" font-size="12.5" fill="#4a5872">Şimdi neyi farklı yapardınız?</text>
</svg>
