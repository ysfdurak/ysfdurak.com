# Sunucudaki ortak altyapı. Şimdilik yalnızca Caddy (giriş kapısı, otomatik HTTPS).
# Projeler kendi compose dosyalarında "web" ağına katılır; dışarıya port açmazlar.
services:
  caddy:
    build: ./caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

  # Ortak PostgreSQL: her proje kendi veritabanını ve kullanıcısını alır.
  # Dışarıya port açılmaz; yalnızca "db" ağındaki konteynerler erişir.
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    # Postgres giriş betiği kullanıcı değiştirmek için yetki ister; yetkiler kısılmadı, yükseltme kapatıldı.
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  web:
    name: web
  db:
    name: db
    internal: true

volumes:
  caddy_data:
  caddy_config:
  pgdata:
