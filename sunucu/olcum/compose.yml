# Ortak ölçüm ve geri bildirim servisi: https://olcum.ysfdurak.com
# Kurulum ve güncelleme: bash ~/ysfdurak.com/sunucu/kurulum-olcum.sh
# Dışarıya port açmaz: Caddy "web" ağından, servis de PostgreSQL'e "db" ağından ulaşır.
services:
  olcum:
    build: .
    container_name: olcum
    env_file: .env
    restart: unless-stopped
    # Sertleştirme (GUVENLIK_TEMELI): salt okunur kök, Linux yetkileri kapalı, yetki yükseltme yok,
    # bellek/süreç/kayıt boyutu sınırlı. Servis diske yazmaz (veri PostgreSQL'de); geçici dosya için /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 192m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - web
      - db

networks:
  web:
    external: true
  db:
    external: true
