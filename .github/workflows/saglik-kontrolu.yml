# Kesinti izleme: tüm canlı adresler 10 dakikada bir dışarıdan kontrol edilir.
# Sorun olursa "kesinti" etiketli bir issue açılır (GitHub e-postayla haber verir), düzelince kapanır.
# Ayrıntı: docs/IZLEME.md
name: Sağlık kontrolü

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      issue_ac:
        description: 'Sorun bulursa kesinti issue''su açılsın mı? (deneme için false)'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: saglik-kontrolu
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/saglik-kontrolu.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_AC: ${{ github.event_name != 'workflow_dispatch' || inputs.issue_ac }}
