# Ortak altyapıda çalıştırma: cd ~/ysfdurak.com/olcum && sudo docker compose up -d --build
# Dışarıya port açılmaz; ortak Caddy "web" ağı üzerinden olcum:8080'e ulaşır.
name: olcum
services:
  olcum:
    build: .
    container_name: olcum
    env_file: .env
    volumes:
      - olcum-veri:/veri
    restart: unless-stopped
    # Sertleştirme (GUVENLIK_TEMELI): salt okunur kök, yetkiler kapalı, yükseltme yok, kaynak sınırlı.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - web

networks:
  web:
    external: true

volumes:
  olcum-veri: {}
